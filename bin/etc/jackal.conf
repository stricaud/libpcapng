# jackal.conf — sample configuration.
#
# jackal reads ~/.jackal.toml if it is there, or whatever --config names.
# Neither is required: with no config at all it reads ./rules and prints
# alerts to stdout, which is what you want while writing a rule.
#
# Install it as the system default, or copy it to get started:
#
#     cp bin/etc/jackal.conf ~/.jackal.toml

[rules]
# A directory of rule files, or one .toml file. A directory is read for the
# known rule-file names — web.toml, dns.toml, tls.toml, malware.toml.
path = "rules"

[output]
# Where alerts go. "-" is stdout; any other path is appended to, so a long
# run can be tailed while it works.
path = "-"

# eve   Suricata-shaped JSON lines, one alert per line. What to use if
#       anything downstream already reads EVE.
# text  one human-readable line per alert, closer to fast.log.
format = "eve"

[detect]
# Worker threads. 1 keeps everything on the calling thread. Packets are pinned
# to a worker by flow hash, so a connection is always examined by one thread
# and stateful decoding stays coherent; alerts are emitted in capture order
# whatever this is set to.
#
# Worth raising only if your rules reach into decoded fields, since that is
# what makes jackal dissect. Note that on some platforms dissection does not
# scale well — see the note in pipeline.h — so measure before committing to a
# large number.
workers = 1
