name: Publish Rust crates to crates.io

# Trigger: push a tag like `rust-v0.15.0`
#
# One-time crates.io setup:
#   cargo login                          # on your machine
#   cargo publish -p pcapng-sys --dry-run   # (from bindings/rust/, after sync-sources.sh)
#   Add CARGO_REGISTRY_TOKEN to repo secrets → Settings → Secrets → Actions

# A plain release tag (v0.18.0) publishes every binding. `rust-v*` still works
# for publishing the crates alone, out of step with the others.
#
# `v*.*.*` and not `v*`: the repo also carries build tags like `v0.1-887d3a1`,
# which have only one dot and must not trigger a publish.
on:
  push:
    tags: ["v*.*.*", "rust-v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish pcapng-sys + libpcapng
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (required by bindgen)
        run: sudo apt-get install -y libclang-dev

      # Both crates take their version from [workspace.package], so the tag has
      # to be written there before publishing. Not committed back: the tag is
      # the source of truth, and cargo publishes with --allow-dirty already.
      # Same trap as npm: cargo puts this in an Authorization header, so a
      # pasted newline fails the publish after the build rather than before it.
      - name: Check crates.io credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          tok="${CARGO_REGISTRY_TOKEN:-}"
          if [ -z "$tok" ]; then
            echo "::error::secret CARGO_REGISTRY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ "$(printf %s "$tok" | tr -d '[:space:]' | wc -c)" -ne "$(printf %s "$tok" | wc -c)" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN contains whitespace (most often a trailing newline from pasting). Re-add it."
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN looks well-formed."

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#rust-}"; VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$GITHUB_REF_NAME' is not a release tag (want vX.Y.Z)"; exit 1 ;;
          esac
          echo "Publishing pcapng-sys + libpcapng $VERSION"
          python3 - "$VERSION" <<'EOF'
          import re, sys, pathlib
          v = sys.argv[1]

          # The crates' own version.
          p = pathlib.Path("bindings/rust/Cargo.toml")
          s = p.read_text()
          s2 = re.sub(r'(\[workspace\.package\][^\[]*?\nversion\s*=\s*")[^"]*(")',
                      lambda m: m.group(1) + v + m.group(2), s, count=1, flags=re.S)
          if s == s2:
              sys.exit("could not find [workspace.package] version to set")
          p.write_text(s2)

          # And what libpcapng requires of pcapng-sys. A published crate cannot
          # depend on a path alone, so cargo resolves this requirement from
          # crates.io when it verifies the packaged tarball. Left at the old
          # number it downloads the *previous* pcapng-sys and fails to compile
          # against anything added since.
          q = pathlib.Path("bindings/rust/libpcapng/Cargo.toml")
          s = q.read_text()
          s2 = re.sub(r'(pcapng-sys\s*=\s*\{[^}]*?version\s*=\s*")[^"]*(")',
                      lambda m: m.group(1) + v + m.group(2), s, count=1)
          if s == s2:
              sys.exit("could not find the pcapng-sys dependency version to set")
          q.write_text(s2)
          EOF
          grep -A2 '\[workspace.package\]' bindings/rust/Cargo.toml
          grep -n 'pcapng-sys' bindings/rust/libpcapng/Cargo.toml

      - name: Vendor C sources
        run: bash bindings/rust/scripts/sync-sources.sh

      - name: Publish pcapng-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: bindings/rust
        # Idempotent: skip if this exact version is already on crates.io, so a
        # re-run of a tag (or a bump where only one crate changed) doesn't fail.
        run: |
          set -e
          VER=$(cargo metadata --no-deps --format-version 1 \
                | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='pcapng-sys'))")
          if curl -sf "https://crates.io/api/v1/crates/pcapng-sys/$VER" >/dev/null; then
            echo "pcapng-sys $VER already published — skipping."
          else
            cargo publish -p pcapng-sys --allow-dirty
            echo "Waiting for crates.io to index pcapng-sys $VER…"
            sleep 30
          fi

      - name: Publish libpcapng
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: bindings/rust
        run: |
          set -e
          VER=$(cargo metadata --no-deps --format-version 1 \
                | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='libpcapng'))")
          if curl -sf "https://crates.io/api/v1/crates/libpcapng/$VER" >/dev/null; then
            echo "libpcapng $VER already published — skipping."
          else
            cargo publish -p libpcapng --allow-dirty
          fi
