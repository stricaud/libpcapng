name: Go bindings

# Validates the Go bindings on every tag of the form bindings/go/vX.Y.Z.
# Publishing is automatic — once the tag is pushed, proxy.golang.org and
# pkg.go.dev pick it up within minutes. No registry push step needed.
on:
  push:
    tags:
      - 'bindings/go/v*'
  pull_request:
    paths:
      - 'bindings/go/**'

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install C build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      - name: Build
        working-directory: bindings/go
        run: go build ./...

      - name: Test
        working-directory: bindings/go
        run: go test ./...

      - name: Vet
        working-directory: bindings/go
        run: go vet ./...

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/bindings/go/v')

    steps:
      - uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#bindings/go/}"
          gh release create "${{ github.ref_name }}" \
            --title "Go bindings ${VERSION}" \
            --notes "$(printf 'Install:\n\n```\ngo get github.com/stricaud/libpcapng/bindings/go@%s\n```\n\nDocumentation: https://pkg.go.dev/github.com/stricaud/libpcapng/bindings/go' "${VERSION}")" \
            2>/dev/null || echo "release already exists"
