# libpcapng filter aliases
#
# Load with:  pcapng_filter_aliases_load("/path/to/filters.conf", errbuf);
# or add entries with: pcapng_filter_alias_add(from, to);
#
# Two kinds of alias:
#
#   Expression alias  (key contains spaces):
#     The whole filter string is replaced before parsing.
#
#   Field alias  (key has no spaces, dotted.name):
#     The field expands to each comma-separated target with OR semantics —
#     the first field found in the packet matches (same as ip.addr → ip.src | ip.dst).
#     Useful for mapping ECS / semantic names to protocol fields.

# ── Semantic filter shortcuts ─────────────────────────────────────────────────

# DNS error responses: QR=Response and RCODE != NoError.
#   Symbolic names resolved from the dns.posa POSA definition via lookup().
#   Requires a DNS POSA provider to be loaded; the provider supplies dns.flags.qr
#   and dns.flags.rcode, making the expression self-documenting.
#   Covers NXDomain (3), ServFail (2), Refused (5), and any future RCODE != 0.
failed dns             = dns.flags.qr == lookup(Response) and dns.flags.rcode != lookup(NoError)

# New TCP connections: SYN set, ACK clear (client-originating SYN only).
new TCP connections    = tcp.flags.syn == 1 and tcp.flags.ack == 0

# Retransmissions: stateful detection via the built-in TCP flow table.
# Requires pcapng_capture_loop() (which auto-creates a flow table), or
# pcapng_capture_filter_match_ex() with an explicit pcapng_flow_table_t.
# Returns 0 in stateless (pcapng_capture_filter_match()) evaluation.
retransmissions        = tcp.analysis.retransmission == 1

# Encrypted traffic: TLS record heuristic + SSH/DTLS/QUIC by port.
#
#   TLS records begin with Content Type (0x16=Handshake) followed by version
#   (0x0301..0x0304). We check the first payload byte of a standard 20-byte
#   TCP header (tcp[20]). Fragile when TCP options are present; combine with
#   port-based fallback for robustness.
#   If a POSA TLS dissector is loaded, prefer: tls.handshake.type == 1
#
#   DTLS (UDP-based TLS) uses dst/src port 4500 (IPsec/NAT-T) or 443 (QUIC).
encrypted traffic      = tcp.dstport in {22, 443, 465, 636, 993, 995, 5061, 5222, 8443} or tcp.srcport in {22, 443, 465, 636, 993, 995, 5061, 5222, 8443} or udp.dstport in {443, 4500} or udp.srcport in {443, 4500}

# Large packets — potential bulk data transfers or uploads.
large uploads          = frame.len > 65000

# ── Security-oriented shortcuts ──────────────────────────────────────────────

# DNS queries (outbound; excludes responses).
show dns requests                  = udp.dstport == 53 or tcp.dstport == 53

# TLS fatal alerts (level 2 = fatal); requires a TLS POSA dissector.
show failed tls handshakes         = tls.alert.level == 2

# Outbound connections to a named country by GeoIP code (e.g. "RU", "CN").
# Requires a GeoIP POSA provider loaded at runtime.
show outbound connections to $1    = geoip.dst_country == $1

# Convenience alias for the most common country-specific security filter.
show outbound connections to Russia = geoip.dst_country == "RU"

# SMB traffic on both legacy (NetBIOS/139) and modern (445) ports.
show suspicious SMB activity       = tcp.dstport in {139, 445} or tcp.srcport in {139, 445}

# HTTP POST bodies larger than 5 MB; requires an HTTP POSA dissector.
show HTTP POST larger than 5 MB    = http.request.method == "POST" and http.content_length > 5242880

# RDP sessions — port-based; time-of-day filtering needs a POSA time provider.
show RDP sessions after 14:00      = tcp.dstport == 3389 or tcp.srcport == 3389

# Frame-level byte pattern search (ASCII or hex string).
show packets containing $1         = frame contains $1

# MITRE ATT&CK T1021 — Remote Services: SSH, DCOM, SMB, RDP, VNC, WinRM.
show packets matching ATT&CK T1021 = tcp.dstport in {22, 135, 445, 3389, 5900, 5985, 5986}

# Regular beaconing heuristic — packets at roughly 60-second intervals.
# True beaconing detection requires stateful inter-arrival timing analysis;
# this selects the candidate traffic (small periodic connections) as a starting point.
show C2 beaconing every 60 seconds = frame.len < 200 and tcp.flags.syn == 1 and tcp.flags.ack == 0

# ── ECS field aliases ─────────────────────────────────────────────────────────
# Elastic Common Schema (ECS) field names → protocol-level fields.
# Fields are supplied by the registered POSA field provider at runtime.
# All expansions use OR semantics: first field found in the packet wins.

# host.name: application-layer hostname seen in the packet.
#   Covers DNS queries, HTTP Host header, TLS SNI, SMTP EHLO/HELO,
#   SIP Request-URI, XMPP to= domain, QUIC TLS SNI.
host.name              = dns.qry.name, http.host, tls.handshake.extensions_server_name, quic.tls.server_name, smtp.ehlo, sip.Request-URI.host, xmpp.bind.hostname

# IP address: any layer-3 address (dual-stack aware).
destination.ip         = ip.dst, ip6.dst
source.ip              = ip.src, ip6.src

# Transport port (TCP or UDP).
destination.port       = tcp.dstport, udp.dstport
source.port            = tcp.srcport, udp.srcport

# Network transport protocol number.
network.transport      = ip.proto

# URL / path observed in the packet (requires HTTP POSA dissector).
url.full               = http.request.uri, http.host
url.domain             = http.host, tls.handshake.extensions_server_name

# User-related fields (requires application-layer POSA dissectors).
user.name              = http.authbasic.username, smtp.auth.username, ftp.request.arg, kerberos.CNameString

# File name / path (requires application-layer POSA dissectors).
file.name              = http.content_disposition.filename, ftp.request.arg, smb.filename
